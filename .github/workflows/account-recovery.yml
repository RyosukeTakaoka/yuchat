# 一回限りの作業：パスワード未設定のゲストアカウント（しゅうや）を、元の uid のまま
# 「ユーザー名とパスワードでログイン」できる状態に戻す（firestore-rules/recover-password-user.mjs）
#
# ・このブランチへの push でだけ動く（main には入れない。作業が終わったらこのファイルは消す）
# ・MODE: check … 読み取りのみ／apply … 確認が通ったときだけ Authentication に内部用メールアドレスと仮パスワードを設定
# ・仮パスワードは Secrets（SHUYA_TEMP_PASSWORD）から渡し、ログには出さない

name: アカウント復旧（一回限り）

on:
  push:
    branches: [claude/yuchat-feature-planning-uxx03k]
    paths:
      - ".github/workflows/account-recovery.yml"
      - "firestore-rules/recover-password-user.mjs"

permissions:
  contents: read

concurrency:
  group: account-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firestore-rules
    env:
      MODE: apply
      TARGET_NAME: しゅうや
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --omit=dev
      - name: 復旧（${{ env.MODE }}）
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEMP_PASSWORD: ${{ env.MODE == 'apply' && secrets.SHUYA_TEMP_PASSWORD || '' }}
        run: node recover-password-user.mjs "$MODE"
