# main にマージされたプルリクエストの「📢 お知らせ文」を、アプリの 📢 お知らせに自動で載せる
#
# ・main への push（＝プルリクエストのマージ）で動く。動くのは main のコードだけで、PR のブランチのコードは実行しない
#   （PR の本文は、GitHub の API から「データ」として読むだけ）
# ・PR の本文に次の形の欄があるときだけ、announcements/pr-{番号} を作る（すでにあれば作らない＝何回実行しても1件だけ）
#     ## 📢 お知らせ文
#     ### タイトル
#     〇〇を追加しました
#     ### 本文
#     今回のアップデートで〇〇ができるようになりました。
# ・プルリクエスト（この仕組みを変えたとき）：テストだけ（Secrets は使わない・お知らせは作らない）
# ・手動実行（Actions タブ → 📢 お知らせの自動作成 → Run workflow）：PR の番号を指定して作り直せる（main へマージ済みの PR だけ）
#
# 鍵：FIREBASE_SERVICE_ACCOUNT（Secrets。ゆうダービー・Firestore ルールと同じもの）。未登録なら何もしない

name: 📢 お知らせの自動作成

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/announcements/**"
      - ".github/workflows/announce-merged-pr.yml"
      - ".github/pull_request_template.md"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "お知らせを作る PR の番号（main へマージ済みのもの）"
        type: string
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: announce-merged-pr
  cancel-in-progress: false

jobs:
  test:
    name: テスト（お知らせの読み取り・重複・秘密の値）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test ".github/announcements/test/*.test.mjs"

  announce:
    name: お知らせの作成
    # main への push と、main での手動実行だけ（プルリクエストでは動かさない）
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 鍵が登録されているか確認
        id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT が使えないため、お知らせの自動作成をスキップしました"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secret.outputs.ready == 'true'
        with:
          node-version: 22

      - name: お知らせの作成
        if: steps.secret.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node .github/announcements/post-announcement.mjs
