# 一回限りの確認：FIREBASE_SERVICE_ACCOUNT が 👤 ユーザー管理で使う Firebase Authentication の管理用 API を呼べるか
# ・本番のユーザーは変更しない（読み取りと、存在しない uid への呼び出しだけ）。鍵・パスワードはログに出さない
# ・このブランチへの push でだけ動く。確認が終わったらこのファイルは消す

name: Authentication 権限の確認（一回限り）

on:
  push:
    branches: [claude/yuchat-feature-planning-uxx03k]
    paths:
      - ".github/workflows/auth-permission-check.yml"
      - "firestore-rules/check-auth-permissions.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firestore-rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund --omit=dev
      - name: 確認（読み取りと、存在しない uid への呼び出しだけ）
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node check-auth-permissions.mjs
