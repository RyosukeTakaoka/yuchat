<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ゆうChat</title>

    <link rel="stylesheet" href="./style.css">

    <meta name="theme-color" content="#ffffff">

    <style>
        /* =========================
           テスト開放中のお知らせ
        ========================= */

        #testNotice {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            box-sizing: border-box;

            z-index: 99999;
        }

        .testNoticeBox {
            width: 100%;
            max-width: 420px;

            background: #ffffff;
            border-radius: 22px;

            padding: 28px 22px;

            box-sizing: border-box;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.25);

            animation: noticeAppear 0.25s ease;
        }

        .testNoticeIcon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .testNoticeBox h2 {
            margin: 0 0 16px;

            font-size: 22px;
            color: #222;
        }

        .testNoticeBox p {
            margin: 10px 0;

            font-size: 15px;
            line-height: 1.7;

            color: #444;
        }

        .testNoticeBox .noticeSmall {
            margin-top: 18px;

            font-size: 13px;
            line-height: 1.6;

            color: #777;
        }

        .testNoticeBox button {
            width: 100%;

            margin-top: 22px;

            padding: 13px 20px;

            border: none;
            border-radius: 13px;

            background: linear-gradient(
                135deg,
                #6c63ff,
                #8b5cf6
            );

            color: #ffffff;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .testNoticeBox button:active {
            transform: scale(0.98);
        }

        @keyframes noticeAppear {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>

</head>


<body>


<!-- =========================
     テスト開放中のお知らせ
========================= -->

<div id="testNotice">

    <div class="testNoticeBox">

        <div class="testNoticeIcon">
            🔧
        </div>

        <h2>
            ゆうChat テスト開放中
        </h2>

        <p>
            現在メンテナンス中ですが、<br>
            一時的にテストのため開放しています。
        </p>

        <p>
            一部の機能が正常に<br>
            動作しない場合があります。
        </p>

        <p class="noticeSmall">
            復旧予定：1週間以内
        </p>

        <button
            onclick="closeTestNotice()">

            OK

        </button>

    </div>

</div>


<!-- =========================
     ログイン画面
========================= -->

<div
    id="loginScreen"
    class="login-screen">

    <div class="login-card">

        <div class="login-logo">
            💬
        </div>

        <h1>
            ゆうChat
        </h1>

        <p>
            友達とつながろう
        </p>

        <button
            id="googleLoginButton"
            class="login-button google-login">

            🔵 Googleでログイン

        </button>

        <button
            id="guestLoginButton"
            class="login-button guest-login">

            👤 ゲストとして始める

        </button>

        <div
            id="loginError"
            class="login-error">
        </div>

    </div>

</div>


<!-- =========================
     ゲスト名設定画面
========================= -->

<div
    id="nameScreen"
    class="login-screen hidden">

    <div class="login-card">

        <div class="login-logo">
            👤
        </div>

        <h1>
            ようこそ！
        </h1>

        <p>
            ゆうChatで使う名前を入力してください
        </p>

        <input
            id="nameInput"
            class="name-input"
            type="text"
            maxlength="20"
            placeholder="名前を入力">

        <button
            id="startChatButton"
            class="login-button guest-login">

            ゆうChatを始める

        </button>

        <div
            id="nameError"
            class="login-error">
        </div>

    </div>

</div>


<!-- =========================
     アプリ本体
========================= -->

<div
    id="app"
    class="app hidden">

    <!-- ヘッダー -->

    <header class="header">

        <div class="profile-area">

            <label
                for="profileImageInput"
                class="profile-image-button">

                <img
                    id="myProfileImage"
                    src=""
                    alt="プロフィール画像">

                <span
                    id="profileImagePlaceholder">
                    👤
                </span>

            </label>

            <input
                id="profileImageInput"
                type="file"
                accept="image/*"
                hidden>

            <div class="profile-info">

                <button
                    id="changeNameButton"
                    class="name-button">

                    <span id="myName">
                        ゆうた
                    </span>

                    ✏️

                </button>

                <div
                    id="status"
                    class="status">

                    🟢 オンライン

                </div>

            </div>

        </div>


        <div class="header-buttons">

            <button
                id="addFriendButton"
                class="header-button">

                ＋

            </button>

            <button
                id="createGroupButton"
                class="header-button">

                👥

            </button>

            <button
                id="logoutButton"
                class="header-button logout-button">

                🚪

            </button>

        </div>

    </header>


    <!-- 友達 -->

    <section class="friends-section">

        <div class="section-title">
            友達
        </div>

        <div
            id="friendsList"
            class="friends-list">
        </div>

    </section>


    <!-- グループ -->

    <section class="groups-section">

        <div class="section-title">
            グループ
        </div>

        <div
            id="groupsList"
            class="groups-list">
        </div>

    </section>


    <!-- チャットヘッダー -->

    <div
        id="chatHeader"
        class="chat-header">

        相手を選択してください

    </div>


    <!-- 返信 -->

    <div
        id="replyBar"
        class="reply-bar hidden">

        <div>

            <div class="reply-title">
                返信中
            </div>

            <div
                id="replyText"
                class="reply-text">
            </div>

        </div>

        <button
            id="cancelReplyButton">

            ×

        </button>

    </div>


    <!-- メッセージ -->

    <main
        id="messages"
        class="messages">
    </main>


    <!-- 入力 -->

    <div class="input-area">

        <input
            id="messageInput"
            type="text"
            placeholder="友達またはグループを選択してください"
            autocomplete="off"
            disabled>

        <button
            id="sendButton"
            disabled>

            送信

        </button>

    </div>

</div>


<script
    type="module"
    src="./script.js">
</script>


<!-- =========================
     お知らせを閉じる処理
========================= -->

<script>
function closeTestNotice() {

    const notice =
        document.getElementById("testNotice");

    if (notice) {
        notice.style.display = "none";
    }

}
</script>


</body>

</html>
